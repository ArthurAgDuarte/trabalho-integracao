# Mosquitto 2.x do Sistema de Detecção de Vazamento de Gás.

# Listener explícito em todas as interfaces. Sem ele, o Mosquitto 2.x entra no
# modo "local only" (só aceita conexões da própria máquina) e o ESP32 não conecta.
listener 1883 0.0.0.0

# Só clientes com usuário e senha. O arquivo é gerado pelo entrypoint.sh a cada
# start, a partir de MQTT_USER/MQTT_PASSWORD do .env, e nunca vai para o git.
allow_anonymous false
password_file /mosquitto/config/passwd

# Guarda em disco as sessões persistentes e as mensagens QoS 1 pendentes
# (por exemplo, as que chegam enquanto a API está fora do ar).
persistence true
persistence_location /mosquitto/data/
# Salva a cada 60 s (o padrão é 30 min), além de salvar ao encerrar.
autosave_interval 60
# A PubSubClient do ESP32 só publica em QoS 0, e por padrão o broker não guarda
# mensagens QoS 0 para sessões offline: sem isto, as leituras publicadas enquanto
# a API reinicia se perderiam. O limite é max_queued_messages (padrão 1000).
queue_qos0_messages true

# Logs no stdout, para aparecerem no "docker compose logs -f".
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
